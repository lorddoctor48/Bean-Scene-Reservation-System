trigger:
- main

variables:
  APP_NAME: ProjectAssessmentBeanSceneRegistrationApp
  APP_TYPE: webApp
  AZURE_PACKAGE_PATH: published
  AZURE_RESOURCE_GROUP: BeanScene
  AZURE_SUBSCRIPTION: AzureServiceConnection
  CONFIGURATION: Release
  DEPLOY_DISPLAY_NAME: Deploy 'ProjectAssessmentBeanSceneRegistrationApp' to Azure App Service
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: .

pool:
  vmImage: windows-latest

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: Build
    displayName: Build Job
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: $(DOTNET_CORE_VERSION)

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: $(WORKING_DIRECTORY)\*.csproj

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: $(WORKING_DIRECTORY)\*.csproj
        arguments: --configuration $(CONFIGURATION)

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: true
        arguments: --configuration $(CONFIGURATION) --output $(AZURE_PACKAGE_PATH)
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: Drop
      inputs:
        PathtoPublish: $(AZURE_PACKAGE_PATH)
        ArtifactName: drop
        publishLocation: Container

- stage: Deploy
  displayName: Deploy Stage
  jobs:
  - job: Deploy
    displayName: Deploy Job
    steps:
    - download: current
      artifact: drop

    - task: AzureWebApp@1
      displayName: $(DEPLOY_DISPLAY_NAME)
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        appType: $(APP_TYPE)
        appName: $(APP_NAME)
        package: $(Pipeline.Workspace)\drop\*.zip
        resourceGroupName: $(AZURE_RESOURCE_GROUP)